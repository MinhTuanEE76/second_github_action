name: test_project

##trigger
on: push

##define jobs
jobs:
  test:
    runs-on: ubuntu-lastest
    steps: 
      - name: Get code
        uses: actions/checkout@v3
      - name: Install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install dependency
        run: npm ci
      - name: Run tests
        run: npm test

